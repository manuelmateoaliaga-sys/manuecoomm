
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - MANU ECOM</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #050505;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .contenedor {
      width: 100%;
      max-width: 500px;
      padding: 30px;
    }

    .volver {
      display: inline-block;
      margin-bottom: 35px;
      color: #999;
      text-decoration: none;
      font-size: 14px;
    }

    .volver:hover {
      color: #fff;
    }

    .marca {
      color: #68c7ff;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 7px;
      margin-bottom: 22px;
    }

    h1 {
      font-size: 42px;
      line-height: 1;
      margin-bottom: 12px;
    }

    .subtitulo {
      color: #999;
      margin-bottom: 35px;
      font-size: 16px;
    }

    .formulario {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 8px;
      color: #aaa;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    input {
      width: 100%;
      padding: 17px;
      border: 1px solid #333;
      border-radius: 10px;
      background: #111;
      color: #fff;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #68c7ff;
    }

    button {
      margin-top: 10px;
      padding: 18px;
      border: none;
      border-radius: 10px;
      background: #68c7ff;
      color: #000;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #8bd5ff;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .mensaje {
      display: none;
      padding: 14px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      line-height: 1.4;
    }

    .error {
      display: block;
      background: #2a0b0b;
      border: 1px solid #8d2929;
      color: #ff6b6b;
    }

    .exito {
      display: block;
      background: #092414;
      border: 1px solid #267a43;
      color: #65df8b;
    }

    .registro {
      margin-top: 25px;
      text-align: center;
      color: #888;
      font-size: 15px;
    }

    .registro a {
      color: #68c7ff;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <main class="contenedor">

    <a href="index.html" class="volver">← Volver a MANU ECOM</a>

    <div class="marca">MANU ECOM</div>

    <h1>INICIAR SESIÓN</h1>

    <p class="subtitulo">
      Accede a tu cuenta para gestionar tus compras y pedidos.
    </p>

    <div id="mensaje" class="mensaje"></div>

    <form id="loginForm" class="formulario">

      <label>
        EMAIL
        <input
          type="email"
          id="email"
          placeholder="tu@email.com"
          autocomplete="email"
          required
        >
      </label>

      <label>
        CONTRASEÑA
        <input
          type="password"
          id="password"
          placeholder="Tu contraseña"
          autocomplete="current-password"
          required
        >
      </label>

      <button type="submit" id="loginBtn">
        INICIAR SESIÓN
      </button>

    </form>

    <div class="registro">
      ¿No tienes una cuenta?
      <a href="registro.html">Crear cuenta</a>
    </div>

  </main>

  <script type="module">

    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword
    } from
      "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


    // CONFIGURACIÓN DE TU PROYECTO FIREBASE

    const firebaseConfig = {
      apiKey: "AIzaSyD38CaxEVX_iVJZqvwlmxsb5w--WtTk8e4",
      authDomain: "manu-ecom.firebaseapp.com",
      projectId: "manu-ecom",
      storageBucket: "manu-ecom.firebasestorage.app",
      messagingSenderId: "461569348434",
      appId: "1:461569348434:web:b822e97aa9c4352f3da08b",
      measurementId: "G-8160RLXC3R"
    };


    // INICIAR FIREBASE

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);


    // ELEMENTOS

    const form = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginBtn = document.getElementById("loginBtn");
    const mensaje = document.getElementById("mensaje");


    // MOSTRAR MENSAJE

    function mostrarMensaje(texto, tipo) {
      mensaje.textContent = texto;
      mensaje.className = "mensaje " + tipo;
    }


    // LOGIN

    form.addEventListener("submit", async (e) => {

      e.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        mostrarMensaje(
          "Introduce tu email y contraseña.",
          "error"
        );
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = "INICIANDO SESIÓN...";

      try {

        const resultado = await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        console.log("Usuario conectado:", resultado.user.uid);

        mostrarMensaje(
          "Sesión iniciada correctamente. Redirigiendo...",
          "exito"
        );

        setTimeout(() => {
          window.location.href = "index.html";
        }, 1000);

      } catch (error) {

        console.error("Error de login:", error);

        let texto = "No se ha podido iniciar sesión.";

        if (
          error.code === "auth/invalid-credential" ||
          error.code === "auth/wrong-password" ||
          error.code === "auth/user-not-found"
        ) {
          texto = "El email o la contraseña no son correctos.";
        }

        if (error.code === "auth/invalid-email") {
          texto = "El email no es válido.";
        }

        if (error.code === "auth/too-many-requests") {
          texto = "Demasiados intentos. Espera unos minutos e inténtalo de nuevo.";
        }

        mostrarMensaje(texto, "error");

        loginBtn.disabled = false;
        loginBtn.textContent = "INICIAR SESIÓN";
      }

    });

  </script>

</body>
</html>
