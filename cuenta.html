
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Mi cuenta - MANU ECOM">

    <meta name="theme-color" content="#080808">

    <title>Mi cuenta | MANU ECOM</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #080808;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* HEADER */

        .header {
            width: 100%;
            border-bottom: 1px solid #222;
            background: #080808;
        }

        .header-container {
            max-width: 1250px;
            margin: auto;
            padding: 22px 25px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .logo {
            font-size: 21px;
            font-weight: 900;
            letter-spacing: 4px;
        }

        .logo span {
            color: #69c8f0;
        }

        .back {
            color: #999;
            font-size: 14px;
            transition: 0.2s;
        }

        .back:hover {
            color: #ffffff;
        }


        /* CONTENEDOR */

        .container {
            width: 100%;
            max-width: 1000px;
            margin: auto;
            padding: 70px 25px;
        }


        /* TITULO */

        .label {
            color: #69c8f0;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 4px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: clamp(42px, 7vw, 72px);
            line-height: 0.95;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        .intro {
            color: #888;
            font-size: 17px;
            margin-bottom: 50px;
        }


        /* PERFIL */

        .profile {
            background: #101010;
            border: 1px solid #292929;
            border-radius: 16px;
            overflow: hidden;
        }

        .profile-top {
            padding: 35px;

            border-bottom: 1px solid #292929;

            display: flex;
            align-items: center;
            gap: 25px;
        }

        .avatar {
            width: 75px;
            height: 75px;

            flex-shrink: 0;

            border-radius: 50%;

            background: #69c8f0;
            color: #071016;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 28px;
            font-weight: 900;
        }

        .profile-name {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .profile-email {
            color: #888;
            font-size: 15px;
        }

        .verified {
            display: inline-block;
            margin-top: 10px;

            color: #70df96;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
        }


        /* DATOS */

        .details {
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .detail {
            padding: 28px 35px;
            border-bottom: 1px solid #292929;
        }

        .detail:nth-child(odd) {
            border-right: 1px solid #292929;
        }

        .detail-label {
            color: #666;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 9px;
        }

        .detail-value {
            color: #ffffff;
            font-size: 17px;
            word-break: break-word;
        }


        /* ACCIONES */

        .actions {
            padding: 30px 35px;

            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-height: 48px;
            padding: 0 22px;

            border-radius: 8px;

            font-size: 14px;
            font-weight: bold;

            cursor: pointer;
            border: 1px solid #333;

            background: #171717;
            color: #ffffff;
        }

        .button:hover {
            background: #222;
        }

        .button-primary {
            background: #69c8f0;
            border-color: #69c8f0;
            color: #071016;
        }

        .button-primary:hover {
            background: #8bd8f7;
        }

        .button-danger {
            color: #ff8d8d;
            border-color: #542727;
        }

        .button-danger:hover {
            background: #251111;
        }


        /* ESTADO */

        .message {
            display: none;

            padding: 15px 18px;
            margin-bottom: 25px;

            border-radius: 9px;

            font-size: 14px;
            line-height: 1.5;
        }

        .message.error {
            display: block;
            background: #2a0b0b;
            border: 1px solid #8d2929;
            color: #ff8d8d;
        }

        .message.loading {
            display: block;
            background: #111;
            border: 1px solid #292929;
            color: #aaa;
        }


        /* FOOTER */

        footer {
            border-top: 1px solid #222;
            margin-top: 40px;
        }

        .footer-container {
            max-width: 1000px;
            margin: auto;
            padding: 30px 25px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;

            color: #666;
            font-size: 13px;
        }


        /* RESPONSIVE */

        @media (max-width: 700px) {

            .container {
                padding-top: 45px;
            }

            .header-container {
                padding: 18px;
            }

            .details {
                grid-template-columns: 1fr;
            }

            .detail:nth-child(odd) {
                border-right: none;
            }

            .profile-top {
                padding: 25px;
            }

            .detail {
                padding: 22px 25px;
            }

            .actions {
                padding: 25px;
            }

            .footer-container {
                flex-direction: column;
                align-items: flex-start;
            }

        }

    </style>
</head>


<body>


    <!-- HEADER -->

    <header class="header">

        <div class="header-container">

            <a href="index.html" class="logo">
                MANU<span>ECOM</span>
            </a>

            <a href="index.html" class="back">
                ← Volver a la tienda
            </a>

        </div>

    </header>


    <!-- CONTENIDO -->

    <main class="container">

        <div class="label">
            MANU ECOM
        </div>

        <h1>
            Mi cuenta
        </h1>

        <p class="intro">
            Gestiona tus datos y consulta la información de tu cuenta.
        </p>


        <div id="message" class="message"></div>


        <!-- PERFIL -->

        <section class="profile">


            <div class="profile-top">

                <div class="avatar" id="avatar">
                    ?
                </div>

                <div>

                    <div class="profile-name" id="profileName">
                        Cargando...
                    </div>

                    <div class="profile-email" id="profileEmail">
                        Cargando...
                    </div>

                    <div class="verified">
                        ● CUENTA ACTIVA
                    </div>

                </div>

            </div>


            <!-- DATOS -->

            <div class="details">


                <div class="detail">

                    <div class="detail-label">
                        Nombre
                    </div>

                    <div class="detail-value" id="nombre">
                        —
                    </div>

                </div>


                <div class="detail">

                    <div class="detail-label">
                        Apellidos
                    </div>

                    <div class="detail-value" id="apellidos">
                        —
                    </div>

                </div>


                <div class="detail">

                    <div class="detail-label">
                        Email
                    </div>

                    <div class="detail-value" id="email">
                        —
                    </div>

                </div>


                <div class="detail">

                    <div class="detail-label">
                        Teléfono
                    </div>

                    <div class="detail-value" id="telefono">
                        —
                    </div>

                </div>


                <div class="detail">

                    <div class="detail-label">
                        ID de usuario
                    </div>

                    <div class="detail-value" id="uid">
                        —
                    </div>

                </div>


                <div class="detail">

                    <div class="detail-label">
                        Fecha de registro
                    </div>

                    <div class="detail-value" id="fechaRegistro">
                        —
                    </div>

                </div>


            </div>


            <!-- ACCIONES -->

            <div class="actions">

                <a
                    href="carrito.html"
                    class="button button-primary">
                    🛒 Ver mi carrito
                </a>

                <button
                    id="logoutButton"
                    class="button button-danger"
                    type="button">
                    Cerrar sesión
                </button>

            </div>


        </section>

    </main>


    <!-- FOOTER -->

    <footer>

        <div class="footer-container">

            <span>
                © 2026 MANU ECOM
            </span>

            <a href="index.html">
                Volver al inicio
            </a>

        </div>

    </footer>



    <!-- FIREBASE -->

    <script type="module">

        import {
            initializeApp
        } from
        "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


        import {
            getAuth,
            onAuthStateChanged,
            signOut
        } from
        "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


        import {
            getFirestore,
            doc,
            getDoc
        } from
        "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


        /* ================================================
           CONFIGURACIÓN FIREBASE
        ================================================= */

        const firebaseConfig = {

            apiKey: "AIzaSyD38CaxEVX_iVJZqvwlmxsb5w--WtTk8e4",

            authDomain: "manu-ecom.firebaseapp.com",

            projectId: "manu-ecom",

            storageBucket: "manu-ecom.firebasestorage.app",

            messagingSenderId: "461569348434",

            appId: "1:461569348434:web:b822e97aa9c4352f3da08b",

            measurementId: "G-8160RLXC3R"

        };


        /* ================================================
           INICIAR FIREBASE
        ================================================= */

        const app =
            initializeApp(firebaseConfig);

        const auth =
            getAuth(app);

        const db =
            getFirestore(app);


        /* ================================================
           ELEMENTOS
        ================================================= */

        const message =
            document.getElementById("message");

        const profileName =
            document.getElementById("profileName");

        const profileEmail =
            document.getElementById("profileEmail");

        const avatar =
            document.getElementById("avatar");

        const nombre =
            document.getElementById("nombre");

        const apellidos =
            document.getElementById("apellidos");

        const email =
            document.getElementById("email");

        const telefono =
            document.getElementById("telefono");

        const uid =
            document.getElementById("uid");

        const fechaRegistro =
            document.getElementById("fechaRegistro");

        const logoutButton =
            document.getElementById("logoutButton");


        /* ================================================
           MENSAJE
        ================================================= */

        function mostrarMensaje(texto, tipo) {

            message.textContent = texto;

            message.className =
                "message " + tipo;

        }


        /* ================================================
           FECHA
        ================================================= */

        function convertirFecha(timestamp) {

            if (!timestamp) {
                return "No disponible";
            }

            try {

                const fecha =
                    timestamp.toDate();

                return fecha.toLocaleDateString(
                    "es-ES",
                    {
                        day: "2-digit",
                        month: "2-digit",
                        year: "numeric"
                    }
                );

            } catch (error) {

                return "No disponible";

            }

        }


        /* ================================================
           CARGAR DATOS DEL USUARIO
        ================================================= */

        async function cargarCuenta(user) {

            try {

                mostrarMensaje(
                    "Cargando información de tu cuenta...",
                    "loading"
                );


                /*
                 * Buscamos el documento:
                 *
                 * usuarios / UID DEL USUARIO
                 */

                const referencia =
                    doc(
                        db,
                        "usuarios",
                        user.uid
                    );


                const documento =
                    await getDoc(referencia);


                if (documento.exists()) {

                    const datos =
                        documento.data();


                    const nombreUsuario =
                        datos.nombre || "";


                    const apellidosUsuario =
                        datos.apellidos || "";


                    const emailUsuario =
                        datos.email || user.email || "";


                    const telefonoUsuario =
                        datos.telefono || "No indicado";


                    /* PERFIL */

                    profileName.textContent =
                        (
                            nombreUsuario +
                            " " +
                            apellidosUsuario
                        ).trim() || "Usuario";


                    profileEmail.textContent =
                        emailUsuario;


                    /* AVATAR */

                    if (nombreUsuario) {

                        avatar.textContent =
                            nombreUsuario
                                .charAt(0)
                                .toUpperCase();

                    } else {

                        avatar.textContent = "?";

                    }


                    /* DATOS */

                    nombre.textContent =
                        nombreUsuario || "No indicado";


                    apellidos.textContent =
                        apellidosUsuario || "No indicado";


                    email.textContent =
                        emailUsuario || "No indicado";


                    telefono.textContent =
                        telefonoUsuario;


                    uid.textContent =
                        user.uid;


                    fechaRegistro.textContent =
                        convertirFecha(
                            datos.creadoEn
                        );


                } else {

                    /*
                     * Si por alguna razón no existe
                     * el documento de Firestore,
                     * seguimos mostrando los datos
                     * básicos de Authentication.
                     */

                    profileName.textContent =
                        "Usuario";

                    profileEmail.textContent =
                        user.email || "—";

                    avatar.textContent =
                        user.email
                            ? user.email.charAt(0).toUpperCase()
                            : "?";

                    email.textContent =
                        user.email || "No indicado";

                    uid.textContent =
                        user.uid;

                    mostrarMensaje(
                        "Tu cuenta existe, pero todavía no encontramos tus datos adicionales.",
                        "error"
                    );

                    return;

                }


                /* OCULTAR MENSAJE */

                message.style.display = "none";


            } catch (error) {

                console.error(
                    "Error cargando la cuenta:",
                    error
                );


                mostrarMensaje(
                    "No se han podido cargar los datos de tu cuenta.",
                    "error"
                );

            }

        }


        /* ================================================
           COMPROBAR SESIÓN
        ================================================= */

        onAuthStateChanged(
            auth,
            (user) => {

                if (user) {

                    console.log(
                        "Usuario conectado:",
                        user.email
                    );

                    cargarCuenta(user);

                } else {

                    /*
                     * Si no hay sesión,
                     * volvemos al login.
                     */

                    window.location.href =
                        "login.html";

                }

            }
        );


        /* ================================================
           CERRAR SESIÓN
        ================================================= */

        logoutButton.addEventListener(
            "click",
            async () => {

                logoutButton.disabled = true;

                logoutButton.textContent =
                    "CERRANDO SESIÓN...";


                try {

                    await signOut(auth);

                    window.location.href =
                        "login.html";


                } catch (error) {

                    console.error(
                        "Error cerrando sesión:",
                        error
                    );


                    mostrarMensaje(
                        "No se ha podido cerrar la sesión.",
                        "error"
                    );


                    logoutButton.disabled =
                        false;

                    logoutButton.textContent =
                        "Cerrar sesión";

                }

            }
        );

    </script>

</body>

</html>
