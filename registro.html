
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta - MANU ECOM</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #080808;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 15px;
    }

    .contenedor {
      width: 100%;
      max-width: 520px;
    }

    .volver {
      display: inline-block;
      color: #aaa;
      text-decoration: none;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .volver:hover {
      color: white;
    }

    .logo {
      color: #5ec8ff;
      font-weight: bold;
      letter-spacing: 5px;
      font-size: 14px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 48px;
      line-height: 0.95;
      margin: 0 0 15px;
      text-transform: uppercase;
    }

    .descripcion {
      color: #999;
      margin-bottom: 30px;
    }

    .formulario {
      background: #101010;
      border: 1px solid #292929;
      border-radius: 16px;
      padding: 30px;
    }

    .fila {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .campo {
      margin-bottom: 20px;
    }

    label {
      display: block;
      color: #aaa;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #0b0b0b;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #5ec8ff;
    }

    button {
      width: 100%;
      padding: 17px;
      border: none;
      border-radius: 9px;
      background: #69c8f0;
      color: #071016;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    button:hover {
      background: #8bd8f7;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .mensaje {
      display: none;
      padding: 14px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      line-height: 1.4;
    }

    .error {
      display: block;
      background: #260d0d;
      border: 1px solid #8d2929;
      color: #ff8d8d;
    }

    .exito {
      display: block;
      background: #0b2415;
      border: 1px solid #247844;
      color: #7ee5a0;
    }

    .login {
      text-align: center;
      color: #888;
      margin-top: 22px;
    }

    .login a {
      color: #69c8f0;
      text-decoration: none;
      font-weight: bold;
    }

    .ayuda {
      color: #777;
      font-size: 12px;
      margin-top: 7px;
    }

    @media (max-width: 600px) {
      .fila {
        grid-template-columns: 1fr;
        gap: 0;
      }

      h1 {
        font-size: 40px;
      }

      .formulario {
        padding: 22px;
      }
    }
  </style>
</head>

<body>

  <main class="contenedor">

    <a href="index.html" class="volver">← Volver a MANU ECOM</a>

    <div class="logo">MANU ECOM</div>

    <h1>Crear<br>cuenta</h1>

    <p class="descripcion">
      Completa tus datos para registrarte.
    </p>

    <div class="formulario">

      <div id="mensaje" class="mensaje"></div>

      <form id="registroForm">

        <div class="fila">

          <div class="campo">
            <label for="nombre">Nombre</label>
            <input
              type="text"
              id="nombre"
              placeholder="Tu nombre"
              required
            >
          </div>

          <div class="campo">
            <label for="apellidos">Apellidos</label>
            <input
              type="text"
              id="apellidos"
              placeholder="Tus apellidos"
              required
            >
          </div>

        </div>

        <div class="campo">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            placeholder="tu@email.com"
            required
          >
        </div>

        <div class="campo">
          <label for="telefono">Teléfono</label>
          <input
            type="tel"
            id="telefono"
            placeholder="+34 600 000 000"
          >
        </div>

        <div class="fila">

          <div class="campo">
            <label for="password">Contraseña</label>
            <input
              type="password"
              id="password"
              placeholder="Mínimo 6 caracteres"
              minlength="6"
              required
            >
            <div class="ayuda">
              Mínimo 6 caracteres.
            </div>
          </div>

          <div class="campo">
            <label for="password2">Repetir contraseña</label>
            <input
              type="password"
              id="password2"
              placeholder="Repite la contraseña"
              minlength="6"
              required
            >
          </div>

        </div>

        <button type="submit" id="btnRegistro">
          CREAR CUENTA
        </button>

      </form>

      <div class="login">
        ¿Ya tienes una cuenta?
        <a href="login.html">Iniciar sesión</a>
      </div>

    </div>

  </main>


  <!-- FIREBASE -->
  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      setDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


    // CONFIGURACIÓN DE TU PROYECTO FIREBASE
    const firebaseConfig = {
      apiKey: "AIzaSyD38CaxEVX_iVJZqvwlmxsb5w--WtTk8e4",
      authDomain: "manu-ecom.firebaseapp.com",
      projectId: "manu-ecom",
      storageBucket: "manu-ecom.firebasestorage.app",
      messagingSenderId: "461569348434",
      appId: "1:461569348434:web:b822e97aa9c4352f3da08b",
      measurementId: "G-8160RLXC3R"
    };


    // INICIAR FIREBASE
    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    // ELEMENTOS DEL FORMULARIO
    const formulario = document.getElementById("registroForm");
    const mensaje = document.getElementById("mensaje");
    const boton = document.getElementById("btnRegistro");


    // MOSTRAR MENSAJE
    function mostrarMensaje(texto, tipo) {

      mensaje.textContent = texto;

      mensaje.className = "mensaje " + tipo;

    }


    // REGISTRO
    formulario.addEventListener("submit", async (event) => {

      event.preventDefault();


      const nombre =
        document.getElementById("nombre").value.trim();

      const apellidos =
        document.getElementById("apellidos").value.trim();

      const email =
        document.getElementById("email").value.trim();

      const telefono =
        document.getElementById("telefono").value.trim();

      const password =
        document.getElementById("password").value;

      const password2 =
        document.getElementById("password2").value;


      // COMPROBAR CONTRASEÑAS
      if (password !== password2) {

        mostrarMensaje(
          "Las contraseñas no coinciden.",
          "error"
        );

        return;
      }


      // COMPROBAR LONGITUD
      if (password.length < 6) {

        mostrarMensaje(
          "La contraseña debe tener al menos 6 caracteres.",
          "error"
        );

        return;
      }


      // DESACTIVAR BOTÓN
      boton.disabled = true;

      boton.textContent = "CREANDO CUENTA...";


      try {

        // CREAR USUARIO EN FIREBASE AUTH
        const resultado =
          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );


        const usuario = resultado.user;


        // GUARDAR DATOS DEL USUARIO EN FIRESTORE
        await setDoc(
          doc(db, "usuarios", usuario.uid),
          {
            uid: usuario.uid,
            nombre: nombre,
            apellidos: apellidos,
            email: email,
            telefono: telefono,
            creadoEn: serverTimestamp()
          }
        );


        // MOSTRAR ÉXITO
        mostrarMensaje(
          "¡Cuenta creada correctamente! Redirigiendo...",
          "exito"
        );


        // REDIRIGIR AL LOGIN
        setTimeout(() => {

          window.location.href = "login.html";

        }, 1800);


      } catch (error) {

        console.error("Error de registro:", error);


        let textoError =
          "No se ha podido crear la cuenta.";


        switch (error.code) {

          case "auth/email-already-in-use":

            textoError =
              "Este correo ya tiene una cuenta.";

            break;


          case "auth/invalid-email":

            textoError =
              "El correo electrónico no es válido.";

            break;


          case "auth/weak-password":

            textoError =
              "La contraseña es demasiado débil.";

            break;


          case "auth/network-request-failed":

            textoError =
              "No hay conexión con Firebase. Comprueba tu conexión a Internet.";

            break;


          case "permission-denied":

          case "firestore/permission-denied":

            textoError =
              "La cuenta se ha creado, pero Firestore ha rechazado guardar tus datos. Tenemos que configurar las reglas de Firestore.";

            break;


          default:

            textoError =
              "Firebase: " +
              (error.message || "Error desconocido.");

        }


        mostrarMensaje(
          textoError,
          "error"
        );


        boton.disabled = false;

        boton.textContent = "CREAR CUENTA";

      }

    });

  </script>

</body>
</html>
